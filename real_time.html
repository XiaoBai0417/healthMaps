    /**
     * General function to add circle layers based on layer configuration

     */
    function addCircleLayer(config) {
      let paint = {};

          'circle-radius': 10,

            1000, '#FFA500', // Orange for medium distances
            5000, '#FF0000'  // Red for long distances
          ],
          'circle-opacity': 0.8
        };
      }

      map.addLayer({
        id: config.layerId,
        type: 'circle',
        source: config.sourceId,
        'source-layer': config.sourceLayer,
        paint: paint
      }, 'waterway-label'); // Adjust layer order as needed
    }

    function formatDistance(meters) {
        return meters >= 1000
          ? (meters / 1000).toFixed(1) + ' km'
          : meters + ' m';
      }

    function formatDuration(seconds) {
        const min = Math.round(seconds / 60);
        return min + ' min';
      }

    function createEndpointElement(letter, label, color, coordinates) {
      const element = document.createElement('div');
      element.title = `${label} (WGS84: ${coordinates[0].toFixed(6)}, ${coordinates[1].toFixed(6)})`;
      element.style.display = 'flex';
      element.style.alignItems = 'center';
      element.style.gap = '5px';
      element.style.zIndex = '10';
      element.innerHTML = `
        <span style="display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:${color};border:2px solid #fff;color:#fff;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.55);">${letter}</span>

      `;
      return element;
    }

    function setEndpointMarkers(originWGS84, destinationWGS84, isDefault = false) {
      if (originMarker) originMarker.remove();
      if (destinationMarker) destinationMarker.remove();

      const originLabel = isDefault ? 'Start' : 'Start';
      const destinationLabel = isDefault ? 'End' : 'End';

      originMarker = new mapboxgl.Marker({
        element: createEndpointElement('A', originLabel, '#16A34A', originWGS84),
        anchor: 'bottom'
      })
        .setLngLat(originWGS84)
        .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(
          `<strong>${originLabel}</strong><br>WGS84: ${originWGS84[0].toFixed(6)}, ${originWGS84[1].toFixed(6)}`
        ))
        .addTo(map);

      destinationMarker = new mapboxgl.Marker({
        element: createEndpointElement('B', destinationLabel, '#DC2626', destinationWGS84),
        anchor: 'bottom'
      })
        .setLngLat(destinationWGS84)
        .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(
          `<strong>${destinationLabel}</strong><br>WGS84: ${destinationWGS84[0].toFixed(6)}, ${destinationWGS84[1].toFixed(6)}`
        ))
        .addTo(map);
    }

    function removeRouteLayer(routeId) {
      const layerId = `${routeId}-layer`;
      if (map.getLayer(layerId)) map.removeLayer(layerId);
      if (map.getSource(routeId)) map.removeSource(routeId);
    }

    function removeDefaultRoutes() {
      [
        defaultWalkRouteId,
        defaultWalkInitialSegmentId,
        defaultWalkFinalSegmentId,
        defaultDriveRouteId,
        defaultDriveInitialSegmentId,
        defaultDriveFinalSegmentId
      ].forEach(removeRouteLayer);
      delete drawnRoutes[defaultWalkRouteId];
      delete drawnRoutes2[defaultDriveRouteId];
    }

    function addCustomLayers() {
      console.log("Adding custom layers...");
      layerConfigs.forEach((config) => {
        // Add data source if it does not exist
        if (!map.getSource(config.sourceId)) {
          console.log(`Adding source: ${config.sourceId}`);
          map.addSource(config.sourceId, {
            type: 'vector',
            url: config.tilesetUrl
          });
        } else {
          console.log(`Source already exists: ${config.sourceId}`);
        }

        // Add layer if it does not exist
        if (!map.getLayer(config.layerId)) {
          console.log(`Adding layer: ${config.layerId}`);
          addCircleLayer(config);

          // If the layer has navigation configuration, add event listeners
          if (config.navigation) {
            // Click event
            map.on('click', config.layerId, async (e) => {
              if (!e.features || !e.features.length) return;
              const feature = e.features[0];

              // Extract WGS84 coordinates
              const originWGS84 = [parseFloat(feature.properties.X1), parseFloat(feature.properties.Y1)];
              const destinationWGS84 = [parseFloat(feature.properties.X2), parseFloat(feature.properties.Y2)];

              // Replace the illustrative default route with the user's selection.
              removeDefaultRoutes();

              // Update the visible endpoint markers to the user's selected pair.
              setEndpointMarkers(originWGS84, destinationWGS84);

              // Convert to GCJ-02 coordinates
              const originGCJ02 = wgs84togcj02(originWGS84[0], originWGS84[1]);
              const destinationGCJ02 = wgs84togcj02(destinationWGS84[0], destinationWGS84[1]);

              // Format as "lng,lat"
              const origin = `${originGCJ02[0]},${originGCJ02[1]}`;
              const destination = `${destinationGCJ02[0]},${destinationGCJ02[1]}`;

              console.log(`Clicked on ${config.layerId}: Origin=${origin}, Destination=${destination}`);

    /**
     * Handles the navigation path and dashed segments
     * @param {object} map - Mapbox map instance
     * @param {string} origin - Origin coordinates in "lng,lat" format (GCJ-02)
     * @param {string} destination - Destination coordinates in "lng,lat" format (GCJ-02)
     * @param {array} originWGS84 - Origin coordinates as [lng, lat] (WGS84)
     * @param {array} destinationWGS84 - Destination coordinates as [lng, lat] (WGS84)
     * @param {string} routeId - Route layer ID
     * @param {string} initialSegmentId - Initial segment layer ID
     * @param {string} finalSegmentId - Final segment layer ID
     */
    async function handleNavigation_walk(map, origin, destination, originWGS84, destinationWGS84, routeId, initialSegmentId, finalSegmentId) {
      console.log(`Handling navigation from ${origin} to ${destination}`);
      const amapUrl = `https://restapi.amap.com/v3/direction/walking?origin=${origin}&destination=${destination}&key=${amapKey}`;
      try {
        const response = await fetch(amapUrl);
        const data = await response.json();

        if (data.status === '1') {
          const steps = data.route.paths[0].steps;
          let path = '';
          steps.forEach(step => {
            path += step.polyline + ';';
          });
          path = path.slice(0, -1); // Remove the last semicolon
          const coordinatesGCJ02 = path.split(';').map(coord => coord.split(',').map(Number));

          // Convert GCJ-02 coordinates to WGS84 coordinates
          const coordinates = coordinatesGCJ02.map(c => gcj02towgs84(c[0], c[1]));

          // Initial dashed segment: from originWGS84 to the first point of the path (WGS84)
          const initialSegment = [originWGS84, coordinates[0]];
          addOrUpdateLayer(map, initialSegmentId, initialSegment, '#FFFFFF', true);

          // Final dashed segment: from the last point of the path (WGS84) to destinationWGS84 (WGS84)
          const finalSegment = [coordinates[coordinates.length - 1], destinationWGS84];
          addOrUpdateLayer(map, finalSegmentId, finalSegment, '#FFFFFF', true);

          // Draw the complete path (WGS84)
          addOrUpdateLayer(map, routeId, coordinates, '#FFFFFF', true);

          // Store the drawn route for persistence after style changes
          drawnRoutes[routeId] = {
            routeId: routeId,
            initialSegmentId: initialSegmentId,
            finalSegmentId: finalSegmentId,
            coordinates: coordinates,
            initialSegment: initialSegment,
            finalSegment: finalSegment
          };

          const pathInfo = data.route.paths[0];
          const duration = Number(pathInfo.duration); // 秒
          const distance = Number(pathInfo.distance); // 米（顺便拿）

          return {
              mode: 'walk',
              duration,
              distance
            };
        }
        // else {
        //   alert('Unable to retrieve navigation route. Please check the origin and destination!');
        // }
      } 
      catch (error) {
        console.error('Error fetching navigation data:', error);
        alert('An error occurred while fetching the navigation route.');
      }
    }

      const amapUrl = `https://restapi.amap.com/v3/direction/driving?origin=${origin}&destination=${destination}&key=${amapKey}`;
      try {
        const response = await fetch(amapUrl);
        const data = await response.json();

        if (data.status === '1') {
          const steps = data.route.paths[0].steps;

          steps.forEach(step => {
            path += step.polyline + ';';
          });
          path = path.slice(0, -1); // Remove the last semicolon

          const coordinates = coordinatesGCJ02.map(c => gcj02towgs84(c[0], c[1]));

          // Initial dashed segment: from originWGS84 to the first point of the path (WGS84)
          const initialSegment = [originWGS84, coordinates[0]];
          addOrUpdateLayer(map, initialSegmentId, initialSegment, '#FF0000', true);

          // Final dashed segment: from the last point of the path (WGS84) to destinationWGS84 (WGS84)
          const finalSegment = [coordinates[coordinates.length - 1], destinationWGS84];
          addOrUpdateLayer(map, finalSegmentId, finalSegment, '#FF0000', true);

          // Draw the complete path (WGS84)
          addOrUpdateLayer(map, routeId, coordinates, '#FF0000', true);

          // Store the drawn route for persistence after style changes
          drawnRoutes2[routeId] = {
            routeId: routeId,
            initialSegmentId: initialSegmentId,
            finalSegmentId: finalSegmentId,
            coordinates: coordinates,
            initialSegment: initialSegment,
            finalSegment: finalSegment
          };



          const pathInfo = data.route.paths[0];
          const duration = Number(pathInfo.duration); // 秒
          const distance = Number(pathInfo.distance); // 米（顺便拿）

          return {
              mode: 'drive',
              duration,
              distance
            };
        }
        // else {
        //   alert('Unable to retrieve navigation route. Please check the origin and destination!');
        // }
      } 
      catch (error) {
        console.error('Error fetching navigation data:', error);
        alert('An error occurred while fetching the navigation route.');
      }
    }

    async function drawDefaultRoutes() {
      const originGCJ02 = wgs84togcj02(defaultOriginWGS84[0], defaultOriginWGS84[1]);
      const destinationGCJ02 = wgs84togcj02(defaultDestinationWGS84[0], defaultDestinationWGS84[1]);
      const origin = `${originGCJ02[0]},${originGCJ02[1]}`;
      const destination = `${destinationGCJ02[0]},${destinationGCJ02[1]}`;

      const walkResult = await handleNavigation_walk(
        map,
        origin,
        destination,
        defaultOriginWGS84,
        defaultDestinationWGS84,
        defaultWalkRouteId,
        defaultWalkInitialSegmentId,
        defaultWalkFinalSegmentId
      );

      const driveResult = await handleNavigation_drive(
        map,
        origin,
        destination,
        defaultOriginWGS84,
        defaultDestinationWGS84,
        defaultDriveRouteId,
        defaultDriveInitialSegmentId,
        defaultDriveFinalSegmentId
      );

      if (walkResult && driveResult) {
        console.log('Default walking and driving routes are ready.');
        showFinishPopup(
          map,
          defaultDestinationWGS84,
          `
            Zoom in for details<br/>
            Drive (red): ${formatDistance(driveResult.distance)}, ${formatDuration(driveResult.duration)}<br/>
            Walk (White): ${formatDistance(walkResult.distance)}, ${formatDuration(walkResult.duration)}<br/>
          `
        );
      }
    }


    

    /**
     * Adds or updates a layer on the map
     * @param {object} map - Mapbox map instance
     * @param {string} id - Layer ID
     * @param {array} coordinates - Array of coordinates [lng, lat] (WGS84)
     * @param {string} color - Line color
     * @param {boolean} isDashed - Whether the line is dashed
     */
    function addOrUpdateLayer(map, id, coordinates, color, isDashed) {
      const layerLayerId = `${id}-layer`;
      if (!map.getSource(id)) {
        console.log(`Adding source and layer: ${layerLayerId}`);
        map.addSource(id, {
          type: 'geojson',
          data: {
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: coordinates
            }
          }
        });

        map.addLayer({
          id: layerLayerId,
          type: 'line',
          source: id,
          layout: {
            'line-cap': 'round',
            'line-join': 'round'
          },
          paint: {
            'line-color': color,
            'line-width': isDashed ? 2 : 2,
            'line-opacity': 0.9,
            ...(isDashed ? { 'line-dasharray': [1, 1] } : {})
          }
        }, 'waterway-label'); // Adjust layer order as needed
      } else {
        console.log(`Updating source data: ${id}`);
        map.getSource(id).setData({
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: coordinates
          }
        });
      }
    }

    /**
     * Converts WGS84 coordinates to GCJ-02
     * Reference: https://github.com/wandergis/coordtransform
     * @param {number} lng - Longitude
     * @param {number} lat - Latitude
     * @returns {Array} Converted coordinates [lng, lat]
     */
    function wgs84togcj02(lng, lat) {
      if (outOfChina(lng, lat)) {
        return [lng, lat];
      }
      let dlat = transformLat(lng - 105.0, lat - 35.0);
      let dlng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dlat = (dlat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dlng = (dlng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      const mgLat = lat + dlat;
      const mgLng = lng + dlng;
      return [mgLng, mgLat];
    }

    /**
     * Converts GCJ-02 coordinates to WGS84
     * Reference: https://github.com/wandergis/coordtransform
     * @param {number} lng - Longitude
     * @param {number} lat - Latitude
     * @returns {Array} Converted coordinates [lng, lat]
     */
    function gcj02towgs84(lng, lat) {
      if (outOfChina(lng, lat)) {
        return [lng, lat];
      }
      let dlat = transformLat(lng - 105.0, lat - 35.0);
      let dlng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dlat = (dlat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dlng = (dlng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      const mgLat = lat + dlat;
      const mgLng = lng + dlng;
      // Reverse the offset to get WGS84 coordinates
      return [lng * 2 - mgLng, lat * 2 - mgLat];
    }

    const a = 6378245.0;
    const ee = 0.00669342162296594323;

    /**
     * Transforms latitude for coordinate conversion
     * @param {number} x 
     * @param {number} y 
     * @returns {number} Transformed latitude
     */
    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }

    /**
     * Transforms longitude for coordinate conversion
     * @param {number} x 
     * @param {number} y 
     * @returns {number} Transformed longitude
     */
    function transformLng(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
      return ret;
    }

    /**
     * Checks if the coordinates are outside of China
     * @param {number} lng - Longitude
     * @param {number} lat - Latitude
     * @returns {boolean} True if outside China, else False
     */
    function outOfChina(lng, lat) {
      // China's coordinate range
      if (lng < 72.004 || lng > 137.8347) {
        return true;
      }
      if (lat < 0.8293 || lat > 55.8271) {
        return true;
      }
      return false;
    }
