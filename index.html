<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthMaps</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: Arial; }
  .tab-container { height: 50px; display: flex; background: #f5f5f5; align-items: center; padding: 0 20px; border-bottom: 1px solid #ddd; }
  .tab { margin-right: 15px; padding: 8px 20px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { border-bottom: 2px solid #ff9800; font-weight: bold; color: #ff9800; }
  #iframeContainer { width: 100%; height: calc(100% - 50px); border: none; }
</style>
</head>
<body>

<div class="tab-container">
  <span class="tab active" data-src="province_level.html">Province-level Map</span>
  <span class="tab" data-src="real_time.html">Real-time Grid Map</span>
</div>

<iframe id="iframeContainer" src="province_level.html"></iframe>

<script>
const tabs = document.querySelectorAll('.tab');
const iframe = document.getElementById('iframeContainer');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    // 切换样式
    document.querySelector('.tab.active').classList.remove('active');
    tab.classList.add('active');
    // 切换 iframe src
    iframe.src = tab.dataset.src;
  });
});
</script>

</body>
</html>
